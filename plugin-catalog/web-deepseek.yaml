name: web-deepseek
repo: https://github.com/Leegenux/hermes-web-deepseek
sha: a9e7ea982e11f6118b0b03723a7b59cc607fd1a8
description: "DeepSeek Search + Fetch — routes web_search and web_extract through
  DeepSeek's own index and server-side fetcher on api.deepseek.com. Disclosure — each
  search/fetch is a separate billed DeepSeek call at 5 CNY per 1,000 successful
  requests per endpoint (5 QPS/account, search and fetch counted separately); the
  provider reuses DEEPSEEK_API_KEY and sends it only to api.deepseek.com; extract
  returns Markdown only (no HTML variant, so web_extract(format=\"html\") gets
  Markdown), and anti-bot or JS-rendered sites fail (zhihu.com, x.com, nytimes.com
  returned HTTP 404 in testing) while static pages work."
maintainer: Leegenux
tier: community
category: web
docs_url: https://github.com/Leegenux/hermes-web-deepseek#readme
version: "1.1.0"
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - DEEPSEEK_API_KEY
